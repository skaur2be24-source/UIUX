
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Trip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Book Your Trip</h1>
    <p>Start planning your next adventure</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="booking.html">Booking</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About Us</a>
</nav>

<section>
    <div class="container">

        <h2>Travel Booking Form</h2>

        <form action="#" method="post">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter phone number">

            <label for="destination">Choose Destination:</label>
            <select id="destination" name="destination" required>
                <option value="">Select destination</option>
                <option value="goa">Goa</option>
                <option value="manali">Manali</option>
                <option value="jaipur">Jaipur</option>
                <option value="paris">Paris</option>
            </select>

            <label for="package">Choose Package:</label>
            <select id="package" name="package" required>
                <option value="">Select package</option>
                <option value="standard">Standard Package</option>
                <option value="premium">Premium Package</option>
                <option value="family">Family Package</option>
            </select>

            <label for="start">Travel Start Date:</label>
            <input type="date" id="start" name="start" required>

            <label for="end">Travel End Date:</label>
            <input type="date" id="end" name="end" required>

            <label for="people">Number of Travelers:</label>
            <input type="number" id="people" name="people"
                   min="1" max="20" required>

            <label for="message">Special Requests:</label>
            <textarea id="message" name="message"
                      rows="4"
                      placeholder="Enter any special requests"></textarea>

            <br><br>

            <button type="submit" class="btn">Submit Booking</button>

        </form>

    </div>
</section>

<footer>
    <p>&copy; 2026 WanderWay Travels</p>
</footer>

</body>
</html>
