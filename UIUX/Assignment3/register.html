
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>TechFest 2026</h1>
    <p>Participant Registration</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="schedule.html">Schedule</a>
    <a href="results.html">Results</a>
    <a href="register.html">Register</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact</a>
    <a href="faq.html">FAQ</a>
</nav>

<main>
    <h2>Register for TechFest</h2>

    <!-- HTML5 form with labels and validation -->
    <form action="#" method="post">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               pattern="[0-9]{10}" required>

        <label for="college">College Name:</label>
        <input type="text" id="college" name="college" required>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="16" max="60" required>

        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="date" required>

        <label for="event">Select Event:</label>
        <select id="event" name="event" required>
            <option value="">Choose Event</option>
            <option>Coding Competition</option>
            <option>Robotics Challenge</option>
            <option>Tech Quiz</option>
        </select>

        <label for="team">Team Name:</label>
        <input type="text" id="team" name="team">

        <label>Participant Type:</label>
        <input type="radio" name="type" value="individual" required> Individual
        <input type="radio" name="type" value="team"> Team

        <label for="branch">Branch:</label>
        <select id="branch" name="branch" required>
            <option value="">Choose Branch</option>
            <option>Computer Engineering</option>
            <option>Electrical Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Other</option>
        </select>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4"></textarea>

        <label>
            <input type="checkbox" name="agree" required>
            I agree to the event rules.
        </label>

        <button type="submit">Submit Registration</button>
        <button type="reset">Reset Form</button>

    </form>
</main>

<footer>© 2026 TechFest</footer>

</body>
</html>
